name: Continuous Integration

on:
  workflow_dispatch: # Permite disparar manualmente em qualquer branch pela interface do GitHub
  push:
    branches:
      - master
      - staging
      - 'gustavo/**'
      - 'feature/**'
      - 'teste*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches:
      - master
      - staging
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Quality & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      # ==========================================
      # ETAPAS DO SONARCLOUD (DESATIVADAS TEMPORARIAMENTE)
