      # ==========================================

      - name: Restore Dependencies
        run: dotnet restore PlataformaEducacional.sln

      - name: Verify Code Formatting
        run: dotnet format PlataformaEducacional.sln --verify-no-changes --verbosity minimal

      - name: Check Vulnerable Packages
        run: dotnet list PlataformaEducacional.sln package --vulnerable --include-transitive

      - name: Build Solution
        run: dotnet build PlataformaEducacional.sln --no-restore -c Release

      - name: Run Tests & Collect Coverage
        run: |
          dotnet test PlataformaEducacional.sln \
            --no-build \
            -c Release \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

