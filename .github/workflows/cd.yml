name: Continuous Deployment

on:
  push:
    branches:
      - master
      - staging
      - gustavo/setup-cd # Incluído para testar a branch atual

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Auth API
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/services/auth/PlataformaEducacional.Auth.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/api-auth:latest,ghcr.io/${{ github.repository_owner }}/api-auth:${{ github.sha }}

      - name: Build and Push Aluno API
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/services/alunos/PlataformaEducacional.Alunos.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/api-aluno:latest,ghcr.io/${{ github.repository_owner }}/api-aluno:${{ github.sha }}

      - name: Build and Push Conteudo API
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/services/conteudo/PlataformaEducacional.Conteudo.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/api-conteudo:latest,ghcr.io/${{ github.repository_owner }}/api-conteudo:${{ github.sha }}

      - name: Build and Push Pagamentos API
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/services/pagamentos/PlataformaEducacional.Pagamentos.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/api-pagamentos:latest,ghcr.io/${{ github.repository_owner }}/api-pagamentos:${{ github.sha }}

      - name: Build and Push BFF API
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/services/bff/PlataformaEducacional.Bff.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/educa-api-bff:latest,ghcr.io/${{ github.repository_owner }}/educa-api-bff:${{ github.sha }}
