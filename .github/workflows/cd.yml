name: Continuous Deployment

on:
  workflow_dispatch: # Permite disparar manualmente pela interface do GitHub
  push:
    branches:
      - master
      - staging
      - 'gustavo/**'
      - 'feature/**'

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Microservices Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Tag Prefix
        id: env-meta
        shell: bash
        run: |
          # Define tags baseadas no ambiente (staging vs master/produção)
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_OWNER=${REPO_OWNER}" >> $GITHUB_ENV
          
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "PRIMARY_TAG=latest" >> $GITHUB_ENV
            echo "SHA_TAG=${{ github.sha }}" >> $GITHUB_ENV
          else
            echo "PRIMARY_TAG=staging" >> $GITHUB_ENV
            echo "SHA_TAG=staging-${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Build and Push Auth API
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/services/auth/PlataformaEducacional.Auth.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/api-auth:${{ env.PRIMARY_TAG }}
            ghcr.io/${{ env.REPO_OWNER }}/api-auth:${{ env.SHA_TAG }}

      - name: Build and Push Aluno API
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/services/alunos/PlataformaEducacional.Alunos.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/api-aluno:${{ env.PRIMARY_TAG }}
            ghcr.io/${{ env.REPO_OWNER }}/api-aluno:${{ env.SHA_TAG }}

      - name: Build and Push Conteudo API
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/services/conteudo/PlataformaEducacional.Conteudo.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/api-conteudo:${{ env.PRIMARY_TAG }}
            ghcr.io/${{ env.REPO_OWNER }}/api-conteudo:${{ env.SHA_TAG }}

      - name: Build and Push Pagamentos API
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/services/pagamentos/PlataformaEducacional.Pagamentos.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/api-pagamentos:${{ env.PRIMARY_TAG }}
            ghcr.io/${{ env.REPO_OWNER }}/api-pagamentos:${{ env.SHA_TAG }}

      - name: Build and Push BFF API
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/services/bff/PlataformaEducacional.Bff.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/educa-api-bff:${{ env.PRIMARY_TAG }}
            ghcr.io/${{ env.REPO_OWNER }}/educa-api-bff:${{ env.SHA_TAG }}
