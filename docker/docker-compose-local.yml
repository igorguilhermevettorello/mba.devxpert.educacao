services:    
    # RabbitMQ
    rabbitmq:
        image: rabbitmq:4-management
        container_name: mba-rabbitmq
        hostname: mba-rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        expose:
            - 5672
            - 15672
        environment:
            RABBITMQ_DEFAULT_USER: "mba-devxpert-educacao"
            RABBITMQ_DEFAULT_PASS: "mba-devxpert-educacao"

    # Sql Server
    sql-server:
        image: mba.devxpert.educacao/mba-sql-sever:latest
        user: "root"
        container_name: mba-sql-server
        build:
            context: ../sql
            dockerfile: ./Dockerfile
        ports:
            - "1433:1433"
        environment:
            SA_PASSWORD: "MeuDB@123"
            ACCEPT_EULA: "Y"    

    # Api de Autenticacao
    api-auth:
        image: mba.devxpert.educacao/api-auth:latest
        container_name: mba-api-auth
        build:
            context: ../src
            dockerfile: ./services/auth/PlataformaEducacional.Auth.Api/Dockerfile
        ports:
            - "5000:8080"
            #- "5000:80"
            # - "5001:443"
        environment:
            - ASPNETCORE_ENVIRONMENT=Docker
            - ASPNETCORE_URLS=http://+:5000
        depends_on:
            - rabbitmq
            - sql-server

