name: mba-devxpert-educacao

services:

    # Sql Server
    sql-server:
        image: mba.devxpert.educacao/mba-sql-sever:latest
        user: "root"
        container_name: mba-sql-server
        build:
            context: ../sql
            dockerfile: ./Dockerfile
        ports:
            - "1433:1433"
        environment:
            SA_PASSWORD: "MeuDB@123"
            ACCEPT_EULA: "Y"  

    # RabbitMQ
    rabbitmq:
        image: rabbitmq:4-management
        container_name: mba-rabbitmq
        hostname: mba-rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        expose:
            - 5672
            - 15672
        environment:
            RABBITMQ_DEFAULT_USER: "mba-devxpert-educacao"
            RABBITMQ_DEFAULT_PASS: "mba-devxpert-educacao"

    # NGINX
    mba-devexpert-educacao-server:
        image: mba.devxpert.educacao/mba-dx-educa-sever:latest
        container_name: mba-dx-educa-server
        build:
            context: ./
            dockerfile: ./nginx/Dockerfile
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - api-auth
            - api-bff

